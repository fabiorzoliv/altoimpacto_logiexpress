{% extends "base.html" %}

{% block content %}

<div class="mb-4">
    <h1 class="h3 mb-1">
        Registrar Abastecimento
    </h1>
    <p class="text-secondary mb-0">
        Informe os dados para registrar um novo abastecimento.
    </p>
</div>

<div class="card shadow-sm">
    <div class="card-header fw-semibold">
        Dados do Abastecimento
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row g-3">
                
                <div class="col-md-6">
                    <label for="veiculo" class="form-label">Veículo *</label>
                    <input type="text" id="veiculo" name="veiculo" class="form-control" required>
                </div>
                
                <div class="col-md-6">
                    <label for="posto" class="form-label">Posto *</label>
                    <input type="text" id="posto" name="posto" class="form-control" required>
                </div>

                <div class="col-md-6">
                    <label for="data" class="form-label">Data *</label>
                    <input type="date" id="data" name="data" class="form-control" required>
                </div>
                
                <div class="col-md-6">
                    <label for="quilometragem" class="form-label">Quilometragem *</label>
                    <input type="number" id="quilometragem" name="quilometragem" class="form-control" min="0" step="1" required>
                </div>

                <div class="col-md-4">
                    <label for="litros" class="form-label">Litros *</label>
                    <input type="number" id="litros" name="litros" class="form-control" min="0.01" step="0.01" required>
                </div>
                
                <div class="col-md-4">
                    <label for="valor_total" class="form-label">Valor Total (R$) *</label>
                    <input type="number" id="valor_total" name="valor_total" class="form-control" min="0.01" step="0.01" required>
                </div>
                
                <div class="col-md-4">
                    <label for="valor_litro" class="form-label">Valor por Litro (R$)</label>
                    <input type="number" id="valor_litro" name="valor_litro" class="form-control" readonly>
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">
                <a href="{{ url_for('abastecimentos_list') }}" class="btn btn-outline-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary">Registrar Abastecimento</button>
            </div>
        </form>
    </div>
</div>

<div class="mt-3 small text-secondary">
    * Campos obrigatórios
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const inputLitros = document.getElementById('litros');
        const inputValorTotal = document.getElementById('valor_total');
        const inputValorLitro = document.getElementById('valor_litro');

        function calcularValorLitro() {
            const litros = parseFloat(inputLitros.value);
            const valorTotal = parseFloat(inputValorTotal.value);

            if (litros > 0 && valorTotal > 0) {
                const valorLitro = valorTotal / litros;
                inputValorLitro.value = valorLitro.toFixed(2);
            } else {
                inputValorLitro.value = '';
            }
        }

        inputLitros.addEventListener('input', calcularValorLitro);
        inputValorTotal.addEventListener('input', calcularValorLitro);
    });
</script>

{% endblock %}
